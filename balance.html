<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ngân sách</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="flex min-h-screen flex-col bg-gray-50 md:h-screen md:flex-row">
    <aside class="flex w-full flex-col bg-blue-300 px-5 py-7 text-white md:h-screen md:w-64 md:flex-none">
      <div class="mb-8 flex items-center gap-3">
        <h1 class="text-xl font-semibold">Personal Finance Management</h1>
      </div>

      <nav>
        <ul class="space-y-2">
          <li><a href="./index.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-slate-600 transition hover:bg-sky-100 hover:text-teal-700">Tổng quan</a></li>
          <li><a href="./transaction.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-slate-600 transition hover:bg-sky-100 hover:text-teal-700">Giao dịch</a></li>
          <li><a href="./category.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-slate-600 transition hover:bg-sky-100 hover:text-teal-700">Danh mục</a></li>
          <li><a href="./balance.html" class="flex items-center gap-3 rounded-xl bg-sky-100 px-4 py-3 text-sm text-teal-700">Ngân sách</a></li>
        </ul>
      </nav>
    </aside>

    <main class="flex-1 overflow-y-auto p-4 md:p-8">
      <header class="mb-8 flex flex-col justify-between gap-4 md:flex-row md:items-center">
        <div>
          <h1 class="text-3xl font-semibold text-slate-800">Ngân sách & thống kê</h1>
          <p class="mt-1 text-sm text-slate-400">Theo dõi hạn mức và so sánh các tháng</p>
        </div>
        <label class="text-sm font-medium text-slate-600">
          Chọn tháng
          <input id="month-picker" type="month" class="ml-2 rounded-lg border border-slate-200 bg-white px-3 py-2" />
        </label>
      </header>

      <section class="rounded-2xl border border-slate-200 bg-white p-6">
        <div class="mb-3 flex items-center justify-between gap-4">
          <h2 class="text-xl font-semibold text-slate-700">Trạng thái ngân sách</h2>
          <span id="budget-status" class="font-semibold text-emerald-600">Đạt</span>
        </div>
        <p id="budget-text" class="mb-3 text-sm text-slate-500">0đ / 0đ (0%)</p>
        <div class="h-3 overflow-hidden rounded-full bg-slate-100">
          <div id="budget-progress" class="h-full rounded-full bg-emerald-500" style="width: 0%"></div>
        </div>
      </section>

      <section class="mt-6 rounded-2xl border border-slate-200 bg-white p-6">
        <h2 class="mb-4 text-xl font-semibold text-slate-700">Cảnh báo hạn mức</h2>
        <div id="budget-alerts" class="space-y-3"></div>
      </section>

      <section class="mt-6">
        <h2 class="mb-4 text-xl font-semibold text-slate-700">Tổng hợp chi tiêu các tháng</h2>
        <div class="overflow-x-auto rounded-2xl border border-slate-200 bg-white">
          <table class="w-full min-w-[650px]">
            <thead class="bg-sky-50">
              <tr class="text-left text-sm text-slate-500">
                <th class="px-5 py-4">Tháng</th>
                <th class="px-5 py-4">Tổng thu</th>
                <th class="px-5 py-4">Tổng chi</th>
                <th class="px-5 py-4">Số dư</th>
              </tr>
            </thead>
            <tbody id="summary-list"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script type="module" src="./dist/app.js"></script>
  </body>
</html>
