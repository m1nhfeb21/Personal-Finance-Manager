<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Finance Management</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="flex min-h-screen flex-col bg-gray-50 md:h-screen md:flex-row">
    <aside class="flex w-full flex-col bg-blue-300 px-5 py-7 text-white md:h-screen md:w-64">
      <div class="mb-8 flex items-center gap-3">
        <h1 class="text-xl font-semibold">Personal Finance Management</h1>
      </div>

      <!-- Navigation-->
      <nav>
        <ul class="space-y-2">
          <li>
            <a
              href="#"
              class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-slate-600 transition hover:bg-sky-100 hover:text-teal-700"
            >
              <span>Tổng quan</span>
            </a>
          </li>

          <li>
            <a
              href="./transaction.html"
              class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-slate-600 transition hover:bg-sky-100 hover:text-teal-700"
            >
              <span>Giao dịch</span>
            </a>
          </li>

          <li>
            <a
              href="./category.html"
              class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-slate-600 transition hover:bg-sky-100 hover:text-teal-700"
            >
              <span>Danh mục</span>
            </a>
          </li>

          <li>
            <a
              href="./balance.html"
              class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-slate-600 transition hover:bg-sky-100 hover:text-teal-700"
            >
              <span>Ngân sách</span>
            </a>
          </li>
        </ul>
      </nav>
    </aside>

    <main class="flex-1 overflow-y-auto p-4 md:p-8">
      <!-- Header Dashboard -->
      <header class="mb-10">
        <div class="flex items-center gap-3">
          <div
            class="h-10 w-1.5 rounded-full bg-gradient-to-b from-sky-400 to-teal-400"
          ></div>

          <div>
            <h1 class="text-3xl font-semibold tracking-tight text-slate-800">
              Tổng quan tài chính
            </h1>

            <p class="mt-1 text-sm text-slate-400">
              Theo dõi tình hình thu chi
            </p>
          </div>
        </div>
      </header>

      <div class="mb-6 flex justify-end">
        <label class="text-sm font-medium text-slate-600">
          Chọn tháng
          <input
            id="month-picker"
            type="month"
            class="ml-2 rounded-lg border border-slate-200 bg-white px-3 py-2"
          />
        </label>
      </div>

      <!-- Financial cards -->
      <section class="grid grid-cols-1 gap-6 md:grid-cols-3">
        <!-- Số dư -->
        <div
          class="group rounded-2xl border-2 border-transparent bg-gradient-to-br from-sky-50 to-cyan-100 p-6 shadow-sm transition-all duration-300 hover:-translate-y-2 hover:border-dashed hover:border-sky-300 hover:shadow-xl hover:shadow-sky-200/60"
        >
          <div>
            <p class="text-xl font-medium text-slate-500 text-center">
              Số dư hiện tại
            </p>

            <!-- đường nằm DƯỚI -->
            <div
              class="mt-3 h-px w-full bg-sky-200 transition-all duration-300 group-hover:bg-sky-400"
            ></div>
          </div>

          <h2
            id="balance"
            class="mt-5 text-center text-3xl font-bold text-teal-600 transition-transform duration-300 group-hover:scale-105"
          >
            0đ
          </h2>
        </div>

        <!-- Tổng thu -->
        <div
          class="group rounded-2xl border-2 border-transparent bg-gradient-to-br from-emerald-50 to-teal-100 p-6 shadow-sm transition-all duration-300 hover:-translate-y-2 hover:border-dashed hover:border-emerald-300 hover:shadow-xl hover:shadow-emerald-200/60"
        >
          <div>
            <p class="text-xl font-medium text-slate-500 text-center">
              Tổng thu
            </p>

            <div
              class="mt-3 h-px w-full bg-emerald-200 transition-all duration-300 group-hover:bg-emerald-400"
            ></div>
          </div>

          <h2
            id="income"
            class="mt-5 text-center text-3xl font-bold text-emerald-600 transition-transform duration-300 group-hover:scale-105"
          >
            0đ
          </h2>
        </div>

        <!-- Tổng chi -->
        <div
          class="group rounded-2xl border-2 border-transparent bg-gradient-to-br from-rose-50 to-orange-100 p-6 shadow-sm transition-all duration-300 hover:-translate-y-2 hover:border-dashed hover:border-rose-300 hover:shadow-xl hover:shadow-rose-200/60"
        >
          <div>
            <p class="text-xl font-medium text-slate-500 text-center">
              Tổng chi
            </p>

            <div
              class="mt-3 h-px w-full bg-rose-200 transition-all duration-300 group-hover:bg-rose-400"
            ></div>
          </div>

          <h2
            id="expense"
            class="mt-5 text-center text-3xl font-bold text-rose-500 transition-transform duration-300 group-hover:scale-105"
          >
            0đ
          </h2>
        </div>
      </section>

      <section class="mt-8 rounded-2xl border border-slate-200 bg-white p-6">
        <div class="mb-3 flex items-center justify-between gap-4">
          <h2 class="text-xl font-semibold text-slate-700">Trạng thái ngân sách</h2>
          <span id="budget-status" class="font-semibold text-emerald-600">Đạt</span>
        </div>
        <p id="budget-text" class="mb-3 text-sm text-slate-500">0đ / 0đ (0%)</p>
        <div class="h-3 overflow-hidden rounded-full bg-slate-100">
          <div id="budget-progress" class="h-full rounded-full bg-emerald-500" style="width: 0%"></div>
        </div>
      </section>

      <section class="mt-8 rounded-2xl border border-slate-200 bg-white p-6">
        <h2 class="mb-4 text-xl font-semibold text-slate-700">Cảnh báo hạn mức</h2>
        <div id="budget-alerts" class="space-y-3"></div>
      </section>

      <section class="mt-8">
        <h2 class="mb-4 text-xl font-semibold text-slate-700">Tổng hợp các tháng</h2>
        <div class="overflow-x-auto rounded-2xl border border-slate-200 bg-white">
          <table class="w-full min-w-[650px]">
            <thead class="bg-sky-50">
              <tr class="text-left text-sm text-slate-500">
                <th class="px-5 py-4">Tháng</th>
                <th class="px-5 py-4">Tổng thu</th>
                <th class="px-5 py-4">Tổng chi</th>
                <th class="px-5 py-4">Số dư</th>
              </tr>
            </thead>
            <tbody id="summary-list"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script type="module" src="./dist/app.js"></script>
  </body>
</html>
