<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transaction</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="flex h-screen bg-gray-50">
    <aside class="flex h-screen w-64 flex-col bg-blue-300 px-5 py-7 text-white">
      <div class="mb-8 flex items-center gap-3">
        <h1 class="text-xl font-semibold">Personal Finance Management</h1>
      </div>

      <!-- Navigation-->
      <nav>
        <ul class="space-y-2">
          <li>
            <a
              href="index.html"
              class="flex items-center gap-3 rounded-xl px-4 py-3 text-xm text-slate-600 transition hover:bg-sky-100 hover:text-teal-700"
            >
              <span>Tổng quan</span>
            </a>
          </li>

          <li>
            <a
              href="./transaction.html"
              class="flex items-center gap-3 rounded-xl px-4 py-3 text-xm text-slate-600 transition hover:bg-sky-100 hover:text-teal-700"
            >
              <span>Giao dịch</span>
            </a>
          </li>

          <li>
            <a
              href="./category.html"
              class="flex items-center gap-3 rounded-xl px-4 py-3 text-xm text-slate-600 transition hover:bg-sky-100 hover:text-teal-700"
            >
              <span>Danh mục</span>
            </a>
          </li>

          <li>
            <a
              href="./balance.html"
              class="flex items-center gap-3 rounded-xl px-4 py-3 text-xm text-slate-600 transition hover:bg-sky-100 hover:text-teal-700"
            >
              <span>Ngân sách</span>
            </a>
          </li>
        </ul>
      </nav>
    </aside>

    <main class="flex-1 overflow-y-auto px-8 py-8 lg:px-12">
      <!--Tiêu đề trang-->
      <header class="mb-8">
        <div class="flex items-center gap-4">
          <div
            class="h-10 w-1.5 rounded-full bg-gradient-to-b from-sky-400 to-teal-400"
          ></div>

          <div>
            <h1 class="text-3xl font-semibold tracking-tight text-slate-800">
              Thêm giao dịch
            </h1>

            <p ckass="mt-1 text-sm text-plate-400">
              Ghi chép khoản thu hoặc chi
            </p>
          </div>
        </div>
      </header>

      <section
        class="rounded-3xl border border-sky-100 bg-gradient-to-br from-white to-sky-50/40 p-8 shadow-xl shadow-slate-200/50"
      >
        <form id="transaction-form">
          <!--grid 2 cột-->
          <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
            <!-- Số tiền -->
            <div>
            <label
              for="amount"
              class="mb-2 block text-sm font-medium text-slate-600"
            >
            Số tiền
            </label>

          <div class="relative">
            <span
             class="absolute left-4 top-1/2 -translate-y-1/2
               font-semibold text-slate-400"
            >
        đ
          </span>

      <input
        id="amount"
        type="number"
        placeholder="Nhập số tiền"
        required
        class="w-full rounded-xl
               border border-slate-200
               bg-white
               py-3 pl-10 pr-4
               text-slate-700
               outline-none
               transition-all duration-300
               placeholder:text-slate-300
               focus:border-sky-400
               focus:ring-4
               focus:ring-sky-100"
      />
    </div>
  </div>

           <!-- Loại giao dịch -->
        <div>
          <label
            for="transaction-type"
            class="mb-2 block text-sm font-medium text-slate-600"
          >
            Loại giao dịch
          </label>

          <select
            id="transaction-type"
            class="w-full rounded-xl
                   border border-slate-200
                   bg-white
                   px-4 py-3
                   text-slate-700
                   outline-none
                   transition-all duration-300
                   focus:border-sky-400
                   focus:ring-4
                   focus:ring-sky-100"
          >
            <option value="income">Thu</option>
            <option value="expense">Chi</option>
          </select>
        </div>


        <!-- Danh mục -->
        <div>
          <label
            for="category"
            class="mb-2 block text-sm font-medium text-slate-600"
          >
            Danh mục
          </label>

          <select
            id="category"
            class="w-full rounded-xl
                   border border-slate-200
                   bg-white
                   px-4 py-3
                   text-slate-700
                   outline-none
                   transition-all duration-300
                   focus:border-sky-400
                   focus:ring-4
                   focus:ring-sky-100"
          >
            <option value="Ăn uống">Ăn uống</option>
            <option value="Di chuyển">Di chuyển</option>
            <option value="Mua sắm">Mua sắm</option>
            <option value="Giải trí">Giải trí</option>
          </select>
        </div>


        <!-- Ngày -->
        <div>
          <label
            for="date"
            class="mb-2 block text-sm font-medium text-slate-600"
          >
            Ngày giao dịch
          </label>

          <input
            id="date"
            type="date"
            required
            class="w-full rounded-xl
                   border border-slate-200
                   bg-white
                   px-4 py-3
                   text-slate-700
                   outline-none
                   transition-all duration-300
                   focus:border-sky-400
                   focus:ring-4
                   focus:ring-sky-100"
          />
        </div>

      </div>


      <!-- Ghi chú: chiếm nguyên hàng -->
      <div class="mt-6">

        <label
          for="note"
          class="mb-2 block text-sm font-medium text-slate-600"
        >
          Ghi chú
          <span class="font-normal text-slate-400">
            (tùy chọn)
          </span>
        </label>

        <input
          id="note"
          type="text"
          placeholder="Ví dụ: Ăn sáng, lương tháng, đi chợ..."
          class="w-full rounded-xl
                 border border-slate-200
                 bg-white
                 px-4 py-3
                 text-slate-700
                 outline-none
                 transition-all duration-300
                 placeholder:text-slate-300
                 focus:border-sky-400
                 focus:ring-4
                 focus:ring-sky-100"
        />

      </div>


      <!-- Các nút -->
      <div class="mt-8 flex justify-end gap-3">

        <button
          type="reset"
          class="rounded-xl
                 border border-slate-200
                 bg-white
                 px-6 py-3
                 font-medium text-slate-500
                 transition-all duration-300
                 hover:-translate-y-1
                 hover:border-sky-200
                 hover:bg-sky-50
                 hover:text-sky-600"
        >
          Đặt lại
        </button>


       <button
  type="submit"
  class="
    rounded-xl
    bg-gradient-to-r from-sky-600 to-blue-700
    px-6 py-3
    font-semibold text-white
    shadow-lg shadow-blue-200/60
    transition-all duration-300
    hover:-translate-y-1
    hover:from-sky-700
    hover:to-blue-800
    hover:shadow-xl
    active:translate-y-0
  "
>
  + Thêm giao dịch
</button>

      </div>

    </form>

  </section>


  <!-- Kết quả từ ui.ts -->
  <div
    class="mt-6 rounded-2xl
           border border-teal-100
           bg-teal-50/70
           px-5 py-4"
  >
    <p
      id="result"
      class="text-sm font-medium text-teal-700"
    ></p>
  </div>


        </form>
      </section>
    </main>

    <script type="module" src="./dist/app.js"></script>
  </body>
</html>
