<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danh mục</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="flex min-h-screen flex-col bg-gray-50 md:h-screen md:flex-row">
    <aside class="flex w-full flex-col bg-blue-300 px-5 py-7 text-white md:h-screen md:w-64 md:flex-none">
      <div class="mb-8 flex items-center gap-3">
        <h1 class="text-xl font-semibold">Personal Finance Management</h1>
      </div>

      <nav>
        <ul class="space-y-2">
          <li><a href="./index.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-slate-600 transition hover:bg-sky-100 hover:text-teal-700">Tổng quan</a></li>
          <li><a href="./transaction.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-slate-600 transition hover:bg-sky-100 hover:text-teal-700">Giao dịch</a></li>
          <li><a href="./category.html" class="flex items-center gap-3 rounded-xl bg-sky-100 px-4 py-3 text-sm text-teal-700">Danh mục</a></li>
          <li><a href="./balance.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-slate-600 transition hover:bg-sky-100 hover:text-teal-700">Ngân sách</a></li>
        </ul>
      </nav>
    </aside>

    <main class="flex-1 overflow-y-auto p-4 md:p-8">
      <header class="mb-8 flex flex-col justify-between gap-4 md:flex-row md:items-center">
        <div>
          <h1 class="text-3xl font-semibold text-slate-800">Quản lý danh mục</h1>
          <p class="mt-1 text-sm text-slate-400">Thêm, sửa và đặt hạn mức chi tiêu</p>
        </div>
        <label class="text-sm font-medium text-slate-600">
          Xem chi tiêu tháng
          <input id="month-picker" type="month" class="ml-2 rounded-lg border border-slate-200 bg-white px-3 py-2" />
        </label>
      </header>

      <section class="rounded-3xl border border-sky-100 bg-gradient-to-br from-white to-sky-50/40 p-6 shadow-xl shadow-slate-200/50 md:p-8">
        <h2 class="mb-6 text-xl font-semibold text-slate-700">Thêm danh mục</h2>

        <form id="category-form">
          <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
            <div>
              <label for="category-name" class="mb-2 block text-sm font-medium text-slate-600">
                Tên danh mục
              </label>
              <input
                id="category-name"
                type="text"
                placeholder="Ví dụ: Ăn uống"
                required
                class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-slate-700 outline-none transition-all duration-300 placeholder:text-slate-300 focus:border-sky-400 focus:ring-4 focus:ring-sky-100"
              />
            </div>

            <div>
              <label for="category-limit" class="mb-2 block text-sm font-medium text-slate-600">
                Hạn mức
              </label>
              <input
                id="category-limit"
                type="number"
                min="1"
                placeholder="Ví dụ: 2000000"
                required
                class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-slate-700 outline-none transition-all duration-300 placeholder:text-slate-300 focus:border-sky-400 focus:ring-4 focus:ring-sky-100"
              />
            </div>
          </div>

          <div class="mt-8 flex justify-end gap-3">
            <button
              type="reset"
              class="rounded-xl border border-slate-200 bg-white px-6 py-3 font-medium text-slate-500 transition-all duration-300 hover:-translate-y-1 hover:border-sky-200 hover:bg-sky-50 hover:text-sky-600"
            >
              Đặt lại
            </button>

            <button
              type="submit"
              class="rounded-xl bg-gradient-to-r from-sky-600 to-blue-700 px-6 py-3 font-semibold text-white shadow-lg shadow-blue-200/60 transition-all duration-300 hover:-translate-y-1 hover:from-sky-700 hover:to-blue-800 hover:shadow-xl"
            >
              + Thêm danh mục
            </button>
          </div>
        </form>
      </section>

      <section class="mt-8">
        <h2 class="mb-4 text-xl font-semibold text-slate-700">Danh sách danh mục</h2>
        <div class="overflow-x-auto rounded-2xl border border-slate-200 bg-white">
          <table class="w-full min-w-[650px]">
            <thead class="bg-sky-50">
              <tr class="text-left text-sm text-slate-500">
                <th class="px-5 py-4">Tên danh mục</th>
                <th class="px-5 py-4">Hạn mức</th>
                <th class="px-5 py-4">Đã chi</th>
                <th class="px-5 py-4">Thao tác</th>
              </tr>
            </thead>
            <tbody id="category-list"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script type="module" src="./dist/app.js"></script>
  </body>
</html>
